services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_FORM_URL: ${VITE_GOOGLE_FORM_URL}
        VITE_GOOGLE_FORM_ENTRY_NAME: ${VITE_GOOGLE_FORM_ENTRY_NAME}
        VITE_GOOGLE_FORM_ENTRY_EMAIL: ${VITE_GOOGLE_FORM_ENTRY_EMAIL}
        VITE_GOOGLE_FORM_ENTRY_PHONE: ${VITE_GOOGLE_FORM_ENTRY_PHONE}
        VITE_GOOGLE_FORM_ENTRY_MESSAGE: ${VITE_GOOGLE_FORM_ENTRY_MESSAGE}
    restart: unless-stopped
    ports:
      - "7000:7000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "7000"
